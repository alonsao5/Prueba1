<title>Isla a la deriva</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Nunito:wght@600;800&display=swap">
<style>
/* Concepto: una sola pantalla de juego. Isla 3D de bloques centrada, HUD arriba, dock de acciones abajo. Estilo juguete: colores vivos, bordes blancos gruesos. */
:root{
  --sky-top:#3fa7f5; --sky-bot:#bfe9ff;
  --ink:#1d3557; --ink-soft:#3b5b82;
  --panel:#ffffff; --panel-edge:#d6ecff;
  --pill:#f6efd9; --pill-edge:#ffffff;
  --orange:#ff8a1f; --orange-d:#d9650a;
  --blue:#2f9bff; --blue-d:#1a6fd1;
  --yellow:#ffc928; --yellow-d:#d79a00;
  --green:#3fc35a; --green-d:#23913a;
  --red:#ef4b4b; --amber:#f5a623;
  --font-display:'Lilita One','Trebuchet MS','Arial Rounded MT Bold',system-ui,sans-serif;
  --font-body:'Nunito','Trebuchet MS',system-ui,sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden}
body{margin:0;background:linear-gradient(var(--sky-top),var(--sky-bot));color:var(--ink);font-family:var(--font-body);font-weight:600;user-select:none;touch-action:none}
#app{position:relative;height:100%;width:100%;overflow:hidden}
#view{position:absolute;inset:0;width:100%;height:100%;display:block}
.safe{padding-left:max(14px,env(safe-area-inset-left,0px));padding-right:max(14px,env(safe-area-inset-right,0px))}
#hud{position:absolute;top:0;left:0;right:0;max-width:520px;margin:0 auto;display:flex;gap:8px;padding-top:10px;pointer-events:none}
.pill{flex:1;min-width:0;display:flex;align-items:center;gap:6px;background:var(--pill);border:3px solid var(--pill-edge);border-radius:999px;padding:3px 4px 3px 4px;box-shadow:0 3px 0 rgba(20,60,110,.25);font-family:var(--font-display);font-size:19px;pointer-events:auto}
.pill svg{width:30px;height:30px;flex:none;margin:-6px 0 -6px -8px}
.pill b{flex:1;text-align:center;font-weight:400;font-variant-numeric:tabular-nums;white-space:nowrap}
.plus{width:26px;height:26px;border-radius:50%;border:0;background:var(--green);color:#fff;font:400 20px/1 var(--font-display);box-shadow:0 2px 0 var(--green-d);cursor:pointer;flex:none;padding:0}
#banner{position:absolute;top:60px;left:0;right:0;padding-right:96px!important;text-align:center;pointer-events:none;color:#fff;text-shadow:0 3px 0 rgba(20,70,140,.55),0 0 8px rgba(20,70,140,.35)}
#banner h1{margin:0;font:400 30px/1.05 var(--font-display);letter-spacing:.3px}
#banner p{margin:2px 0 0;font-weight:800;font-size:15px}
#trip{display:none;margin:8px auto 0;width:min(320px,80%);pointer-events:auto;text-shadow:none;color:var(--ink)}
#trip.on{display:block}
.bar{height:16px;border-radius:99px;background:#fff;border:3px solid #fff;box-shadow:0 2px 0 rgba(20,60,110,.3),inset 0 0 0 2px #cfe6fb;overflow:hidden}
.bar i{display:block;height:100%;background:linear-gradient(var(--yellow),var(--orange));border-radius:99px;width:0}
#trip .row{display:flex;justify-content:space-between;align-items:center;margin-top:6px;font-size:14px;color:#fff;text-shadow:0 2px 0 rgba(20,70,140,.6)}
#hint{position:absolute;left:0;right:0;bottom:128px;text-align:center;pointer-events:none}
#hint span{display:inline-block;background:rgba(255,255,255,.92);color:var(--ink);padding:7px 14px;border-radius:999px;font-weight:800;font-size:14px;box-shadow:0 3px 0 rgba(20,60,110,.2)}
#map{position:absolute;top:58px;right:max(10px,env(safe-area-inset-right,0px));width:76px;height:76px;border-radius:50%;border:4px solid #fff;box-shadow:0 3px 0 rgba(20,60,110,.3);background:#58b6ff;padding:0;overflow:hidden;cursor:pointer}
#map canvas{width:100%;height:100%;display:block}
#dock{position:absolute;left:0;right:0;bottom:0;display:flex;align-items:flex-end;justify-content:center;gap:10px;padding-bottom:calc(10px + env(safe-area-inset-bottom,0px))}
.btn{border:0;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;color:#fff;font:400 15px/1 var(--font-display);text-shadow:0 2px 0 rgba(0,0,0,.28);border-radius:50%;border:4px solid #fff;position:relative;transition:transform .08s}
.btn:active{transform:translateY(3px) scale(.97)}
.btn svg{width:34px;height:34px;filter:drop-shadow(0 2px 0 rgba(0,0,0,.25))}
.btn.big{width:108px;height:108px;background:radial-gradient(circle at 35% 25%,#ffb552,var(--orange) 60%);box-shadow:0 5px 0 var(--orange-d);font-size:20px;margin-right:2px}
.btn.big svg{width:54px;height:54px}
.btn.sm{width:76px;height:76px;box-shadow:0 5px 0 rgba(10,40,90,.35)}
.btn.sm.b{background:radial-gradient(circle at 35% 25%,#6cc0ff,var(--blue) 60%);box-shadow:0 5px 0 var(--blue-d)}
.btn.sm.y{background:radial-gradient(circle at 35% 25%,#ffe27a,var(--yellow) 60%);box-shadow:0 5px 0 var(--yellow-d)}
.btn.sm.g{background:radial-gradient(circle at 35% 25%,#7be28f,var(--green) 60%);box-shadow:0 5px 0 var(--green-d)}
.btn .dot{position:absolute;top:-4px;right:-2px;min-width:22px;height:22px;border-radius:99px;background:var(--red);border:3px solid #fff;font-size:12px;display:flex;align-items:center;justify-content:center;padding:0 4px;text-shadow:none}
#shade{position:absolute;inset:0;background:rgba(10,40,90,.45);display:none;z-index:5}
#shade.on{display:block}
#sheet{position:absolute;left:0;right:0;bottom:0;max-height:86%;z-index:6;display:none;flex-direction:column;padding-bottom:env(safe-area-inset-bottom,0px)}
#sheet.on{display:flex}
.sheet-in{background:var(--panel);border:4px solid #fff;border-bottom:0;border-radius:26px 26px 0 0;box-shadow:0 -6px 0 var(--panel-edge);display:flex;flex-direction:column;min-height:0;max-width:560px;width:100%;margin:0 auto}
.sheet-head{display:flex;align-items:center;justify-content:space-between;padding:12px 16px 6px}
.sheet-head h2{margin:0;font:400 26px/1 var(--font-display);color:var(--ink)}
.x{width:36px;height:36px;border-radius:50%;border:0;background:var(--red);color:#fff;font:400 22px/1 var(--font-display);box-shadow:0 3px 0 #b82d2d;cursor:pointer}
.sheet-body{overflow:auto;padding:4px 16px 18px;touch-action:pan-y;-webkit-overflow-scrolling:touch}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:4px 0 10px}
.chip{display:inline-flex;align-items:center;gap:5px;background:#eef6ff;border:2px solid #d3e6fb;border-radius:99px;padding:3px 10px;font-weight:800;font-size:13px}
.chip.ok{background:#e4f8e8;border-color:#b6e9c0;color:#1d7a33}
.chip.mid{background:#fff3da;border-color:#f7dc9f;color:#9a6200}
.chip.bad{background:#ffe5e5;border-color:#f7b9b9;color:#b02121}
.card{border:3px solid #e1eefb;border-radius:18px;padding:12px;margin-bottom:12px;background:#fbfdff}
.card h3{margin:0 0 2px;font:400 21px/1.1 var(--font-display)}
.card p{margin:2px 0 8px;font-size:13.5px;color:var(--ink-soft);font-weight:700}
.haz{display:flex;align-items:center;gap:8px;margin:5px 0;font-size:13.5px;font-weight:800}
.haz .m{flex:1;height:10px;background:#e3edf7;border-radius:99px;overflow:hidden}
.haz .m i{display:block;height:100%;border-radius:99px}
.go{width:100%;border:0;border-radius:16px;padding:11px;margin-top:8px;color:#fff;font:400 20px/1 var(--font-display);cursor:pointer;background:var(--orange);box-shadow:0 4px 0 var(--orange-d);text-shadow:0 2px 0 rgba(0,0,0,.25)}
.go:active{transform:translateY(3px);box-shadow:0 1px 0 var(--orange-d)}
.go[disabled]{background:#b9c7d6;box-shadow:0 4px 0 #8c9cae;cursor:not-allowed}
.go.blue{background:var(--blue);box-shadow:0 4px 0 var(--blue-d)}
.go.green{background:var(--green);box-shadow:0 4px 0 var(--green-d)}
.go.small{width:auto;padding:8px 14px;font-size:16px;margin:0}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.opt{border:3px solid #e1eefb;border-radius:14px;padding:8px;background:#fff;text-align:left;cursor:pointer;font-family:inherit;color:var(--ink)}
.opt b{display:block;font:400 17px/1.1 var(--font-display)}
.opt small{display:block;font-size:12px;color:var(--ink-soft);margin:2px 0 4px;font-weight:700}
.opt[disabled]{opacity:.5;cursor:not-allowed}
.cost{font-size:12.5px;font-weight:800}
.cost.no{color:var(--red)}
.slot{display:flex;align-items:center;justify-content:space-between;gap:10px}
.tag{font:400 13px/1 var(--font-display);padding:4px 9px;border-radius:99px;background:#ffe5e5;color:#b02121}
.log{border-left:5px solid var(--blue);padding:6px 10px;margin:0 0 10px;background:#f3f9ff;border-radius:0 12px 12px 0;font-size:13.5px}
.log b{font-family:var(--font-display);font-weight:400;font-size:16px;display:block}
.loot{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0}
.loot span{display:inline-flex;align-items:center;gap:4px;font:400 18px/1 var(--font-display)}
.loot svg{width:24px;height:24px}
#toast{position:absolute;left:50%;top:150px;transform:translateX(-50%) translateY(-10px);background:var(--ink);color:#fff;padding:8px 14px;border-radius:99px;font-weight:800;font-size:14px;opacity:0;transition:.25s;pointer-events:none;z-index:9;white-space:nowrap;max-width:92%;overflow:hidden;text-overflow:ellipsis}
#toast.on{opacity:1;transform:translateX(-50%)}
.wheel-wrap{position:relative;width:230px;height:230px;margin:6px auto 14px}
.wheel{width:100%;height:100%;border-radius:50%;border:6px solid #fff;box-shadow:0 4px 0 rgba(20,60,110,.3);transition:transform 4s cubic-bezier(.15,.7,.1,1);position:relative}
.wheel span{position:absolute;left:50%;top:50%;font:400 22px/1 var(--font-display);color:#fff;text-shadow:0 2px 0 rgba(0,0,0,.35);transform-origin:0 0}
.pointer{position:absolute;left:50%;top:-10px;margin-left:-14px;width:0;height:0;border-left:14px solid transparent;border-right:14px solid transparent;border-top:28px solid var(--red);filter:drop-shadow(0 2px 0 rgba(0,0,0,.3));z-index:2}
.note{font-size:12.5px;color:var(--ink-soft);text-align:center;margin:6px 0 0;font-weight:700}
@media (max-width:380px){.btn.big{width:92px;height:92px}.btn.sm{width:66px;height:66px;font-size:13px}.btn.sm svg{width:28px;height:28px}.pill{font-size:16px}}
@media (min-width:700px){#dock{gap:16px}}
@media (prefers-reduced-motion:reduce){.wheel{transition:none}}
</style>

<div id="app">
  <canvas id="view"></canvas>
  <div id="hud" class="safe"></div>
  <div id="banner" class="safe">
    <h1 id="bt">Isla a la deriva</h1>
    <p id="bs"></p>
    <div id="trip"><div class="bar"><i id="tbar"></i></div><div class="row"><span id="teta"></span><button class="go small green" id="tfast">Acelerar</button></div></div>
  </div>
  <button id="map" aria-label="Mapa del viaje"><canvas id="mapc" width="152" height="152"></canvas></button>
  <div id="hint"><span id="hinttxt"></span></div>
  <nav id="dock" class="safe">
    <button class="btn big" id="bExplore"></button>
    <button class="btn sm b" id="bBuild"></button>
    <button class="btn sm y" id="bLog"></button>
    <button class="btn sm g" id="bCrew"></button>
  </nav>
  <div id="shade"></div>
  <div id="sheet"><div class="sheet-in"><div class="sheet-head"><h2 id="st"></h2><button class="x" id="sx" aria-label="Cerrar">×</button></div><div class="sheet-body" id="sb"></div></div></div>
  <div id="toast"></div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(() => {
'use strict';
const T = THREE;
const $ = s => document.querySelector(s);
const el = (tag, cls, html) => { const e = document.createElement(tag); if (cls) e.className = cls; if (html != null) e.innerHTML = html; return e; };
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const KEY = 'isla-deriva-v1';
const store = {
  get() { try { return JSON.parse(localStorage.getItem(KEY)); } catch (e) { return null; } },
  set(v) { try { localStorage.setItem(KEY, JSON.stringify(v)); } catch (e) {} }
};

/* ---------- iconos ---------- */
const IC = {
  wood: '<svg viewBox="0 0 40 40"><rect x="4" y="22" width="26" height="12" rx="6" fill="#b9733b"/><rect x="10" y="10" width="26" height="12" rx="6" fill="#d68b4a"/><circle cx="30" cy="16" r="4" fill="#f3c18c"/><circle cx="24" cy="28" r="4" fill="#d9a06a"/></svg>',
  stone: '<svg viewBox="0 0 40 40"><path d="M6 28 L12 12 L26 8 L35 20 L31 33 L14 34Z" fill="#9aa3ad"/><path d="M12 12 L26 8 L22 20Z" fill="#c3cad1"/><path d="M22 20 L35 20 L31 33 L14 34Z" fill="#7d8791"/></svg>',
  gems: '<svg viewBox="0 0 40 40"><path d="M8 15 L14 7 H26 L32 15 L20 34Z" fill="#e24bd8"/><path d="M8 15 L32 15 L20 34Z" fill="#b92eb0"/><path d="M14 7 L17 15 L20 7Z M26 7 L23 15 L20 7Z" fill="#f59cf0"/></svg>',
  pearls: '<svg viewBox="0 0 40 40"><path d="M20 4 L25 15 L36 20 L25 25 L20 36 L15 25 L4 20 L15 15Z" fill="#8be8ff"/><path d="M20 4 L25 15 L20 20 L15 15Z" fill="#d6f8ff"/></svg>',
  compass: '<svg viewBox="0 0 48 48"><rect x="5" y="9" width="30" height="30" rx="4" fill="#fff6d6" stroke="#b98a4a" stroke-width="3"/><path d="M8 28 l8-6 8 6 8-8" fill="none" stroke="#3fc35a" stroke-width="4" stroke-linecap="round"/><circle cx="34" cy="31" r="10" fill="#ffc928" stroke="#fff" stroke-width="3"/><path d="M34 24 l3 8 -3 -2 -3 2z" fill="#d9650a"/></svg>',
  up: '<svg viewBox="0 0 48 48"><circle cx="17" cy="31" r="7" fill="#ff5a5a" stroke="#fff" stroke-width="3"/><path d="M20 28 L36 12" stroke="#fff" stroke-width="6" stroke-linecap="round"/><path d="M28 10 H38 V20" fill="none" stroke="#ffc928" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/></svg>',
  log: '<svg viewBox="0 0 48 48"><rect x="9" y="8" width="30" height="34" rx="5" fill="#c68a4b" stroke="#fff" stroke-width="3"/><rect x="14" y="14" width="20" height="24" rx="2" fill="#fff6d6"/><path d="M18 21 h12 M18 27 h12 M18 33 h8" stroke="#b98a4a" stroke-width="3" stroke-linecap="round"/><rect x="18" y="5" width="12" height="7" rx="3" fill="#888"/></svg>',
  crew: '<svg viewBox="0 0 48 48"><circle cx="16" cy="18" r="6" fill="#ffd7b0"/><circle cx="32" cy="18" r="6" fill="#ffd7b0"/><path d="M5 40 q0-14 11-14 q11 0 11 14z" fill="#2f9bff"/><path d="M21 40 q0-14 11-14 q11 0 11 14z" fill="#ff6b6b"/></svg>'
};

/* ---------- datos del juego ---------- */
const BUILD = {
  cabana:   { name: 'Cabaña',      cost: { wood: 60, stone: 10 }, stat: 'def',   desc: '+1 Defensa contra criaturas.' },
  faro:     { name: 'Faro',        cost: { wood: 50, stone: 60 }, stat: 'fog',   desc: '+1 Visión en la niebla.' },
  rayo:     { name: 'Pararrayos',  cost: { wood: 40, stone: 50 }, stat: 'storm', desc: '+1 Protección en tormentas.' },
  vela:     { name: 'Vela',        cost: { wood: 90, stone: 20 }, stat: 'speed', desc: 'Viajes un 15 % más rápidos.' },
  molino:   { name: 'Molino',      cost: { wood: 80, stone: 30 }, stat: 'mill',  desc: '+25 % de madera en cada viaje.' },
  granja:   { name: 'Granja',      cost: { wood: 50, stone: 0 },  stat: 'farm',  desc: 'Repara 1 daño al volver.' }
};
const HAZ = {
  storm: { name: 'Tormenta',  stat: 'storm', helper: 'Pararrayos' },
  fog:   { name: 'Niebla',    stat: 'fog',   helper: 'Faro' },
  def:   { name: 'Criaturas', stat: 'def',   helper: 'Cabañas' }
};
const ROUTES = [
  { id: 'valle', name: 'Valle tranquilo', secs: 25, blurb: 'Corrientes suaves. Ideal para reunir madera.',
    events: [{ t: 'storm', l: 1 }, { t: 'fog', l: 1 }],
    loot: { wood: [14, 22], stone: [5, 9] }, places: ['Valle Susurrante', 'Prado de las Brisas', 'Costa Dorada'] },
  { id: 'tormenta', name: 'Mar de tormentas', secs: 45, blurb: 'Rayos y olas gigantes. Mucha piedra y algunas gemas.',
    events: [{ t: 'storm', l: 2 }, { t: 'def', l: 1 }, { t: 'storm', l: 3 }],
    loot: { stone: [20, 30], wood: [10, 16], gems: [3, 5] }, places: ['Cabo Trueno', 'Bahía del Rayo', 'Mar de Cristal Negro'] },
  { id: 'niebla', name: 'Arrecife velado', secs: 70, blurb: 'Niebla espesa y criaturas. Gemas y cristales estelares.',
    events: [{ t: 'fog', l: 2 }, { t: 'def', l: 2 }, { t: 'fog', l: 3 }],
    loot: { gems: [6, 9], stone: [10, 16], pearls: [1, 1] }, places: ['Arrecife Perdido', 'Laguna Opalina', 'Isla Velada'] }
];
const NPLOTS = 6;
const fresh = () => ({
  res: { wood: 300, stone: 160, gems: 20, pearls: 0 },
  plots: [{ type: 'cabana', dmg: false }, { type: 'granja', dmg: false }, null, null, null, null],
  trip: null, log: [], place: 'Valle Susurrante', seenHint: false, wheelAt: 0, trips: 0
});
let S = store.get();
if (!S || !S.plots || S.plots.length !== NPLOTS) S = fresh();
const save = () => store.set(S);

function stats() {
  const s = { storm: 0, fog: 0, def: 0, speed: 0, mill: 0, farm: 0 };
  S.plots.forEach(p => { if (p && !p.dmg) s[BUILD[p.type].stat]++; });
  return s;
}
function duration(route) { const s = stats(); return Math.round(route.secs * Math.max(0.55, 1 - 0.15 * s.speed)); }
function canPay(cost) { return Object.keys(cost).every(k => S.res[k] >= cost[k]); }
function pay(cost) { Object.keys(cost).forEach(k => S.res[k] -= cost[k]); }
function costHtml(cost) { return Object.keys(cost).filter(k => cost[k]).map(k => `<span class="${S.res[k] >= cost[k] ? '' : 'no'}">${cost[k]} ${k === 'wood' ? 'mad.' : 'pied.'}</span>`).join(' · ') || 'Gratis'; }
function mulberry(a) { return () => { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
function chance(stat, lvl) { const d = stat - lvl; return d >= 0 ? Math.min(0.95, 0.88 + 0.035 * d) : Math.max(0.1, 0.55 + 0.2 * d); }

/* ---------- viaje ---------- */
function depart(rid) {
  if (S.trip) return;
  const route = ROUTES.find(r => r.id === rid);
  const secs = duration(route);
  S.trip = { rid, start: Date.now(), end: Date.now() + secs * 1000, seed: (Math.random() * 1e9) | 0, stats: stats() };
  save(); closeSheet(); refreshAll(); toast('¡Zarpando hacia ' + route.name + '!');
}
function resolveTrip() {
  const tr = S.trip; if (!tr) return;
  const route = ROUTES.find(r => r.id === tr.rid);
  const rng = mulberry(tr.seed);
  const st = tr.stats;
  const out = { route: route.name, events: [], loot: { wood: 0, stone: 0, gems: 0, pearls: 0 }, damaged: [], repaired: null };
  route.events.forEach(ev => {
    const p = chance(st[HAZ[ev.t].stat], ev.l);
    const ok = rng() < p;
    const part = {};
    Object.keys(route.loot).forEach(k => { const [a, b] = route.loot[k]; part[k] = Math.round(a + (b - a) * rng()) * (k === 'pearls' ? (ev.l >= 3 ? 1 : 0) : 1); });
    const e = { t: ev.t, l: ev.l, ok, dmg: null };
    if (ok) { Object.keys(part).forEach(k => out.loot[k] += part[k]); }
    else {
      Object.keys(part).forEach(k => out.loot[k] += Math.floor(part[k] * 0.3));
      const cand = S.plots.map((p2, i) => ({ p2, i })).filter(o => o.p2 && !o.p2.dmg);
      if (cand.length) { const pick = cand[Math.floor(rng() * cand.length)]; pick.p2.dmg = true; e.dmg = BUILD[pick.p2.type].name; out.damaged.push(e.dmg); }
    }
    out.events.push(e);
  });
  const mill = S.plots.filter(p => p && !p.dmg && p.type === 'molino').length;
  out.loot.wood = Math.round(out.loot.wood * (1 + 0.25 * mill));
  Object.keys(out.loot).forEach(k => S.res[k] += out.loot[k]);
  const farm = S.plots.some(p => p && !p.dmg && p.type === 'granja');
  if (farm) { const d = S.plots.find(p => p && p.dmg); if (d) { d.dmg = false; out.repaired = BUILD[d.type].name; } }
  S.place = route.places[Math.floor(rng() * route.places.length)];
  S.trips++;
  out.place = S.place;
  S.log.unshift({ at: Date.now(), ...out });
  S.log = S.log.slice(0, 12);
  S.trip = null; S.justBack = true;
  save();
  refreshAll();
  showSummary(out);
}

/* ---------- UI: HUD, banner, hojas ---------- */
const hud = $('#hud');
function buildHud() {
  hud.innerHTML = '';
  [['wood', 'wood'], ['stone', 'stone'], ['gems', 'gems']].forEach(([k, ic]) => {
    const p = el('div', 'pill', IC[ic] + `<b id="r-${k}">0</b>`);

function faro(g) { for (let i = 0; i < 4; i++) g.add(mesh(cylG(0.2 - i * 0.02, 0.24 - i * 0.02, 0.3, 10), M(i % 2 ? '#fff' : '#e0383b'), 0, 0.15 + i * 0.3, 0)); g.add(mesh(cylG(0.26, 0.26, 0.06, 10), M('#444'), 0, 1.23, 0)); g.add(mesh(cylG(0.14, 0.14, 0.2, 8), M('#ffe27a', { emissive: new T.Color('#ffcc33'), emissiveIntensity: 0.6 }), 0, 1.36, 0)); g.add(mesh(new T.ConeGeometry(0.22, 0.22, 10), M('#e0383b'), 0, 1.57, 0)); }
function rayo(g) { g.add(box(0.5, 0.12, 0.5, '#8c97a3', 0, 0.06, 0)); g.add(mesh(cylG(0.05, 0.1, 1.3, 6), M('#9aa6b3'), 0, 0.77, 0)); g.add(mesh(new T.ConeGeometry(0.08, 0.28, 6), M('#ffc928', { emissive: new T.Color('#ffb400'), emissiveIntensity: 0.5 }), 0, 1.58, 0)); g.add(mesh(new T.TorusGeometry(0.18, 0.025, 6, 14), M('#ffc928'), 0, 1.1, 0)); }
function vela(g) { g.add(box(0.8, 0.1, 0.5, '#9a6a3a', 0, 0.05, 0)); g.add(mesh(cylG(0.04, 0.04, 1.3, 6), M('#6b4423'), 0, 0.7, 0)); const s = new T.Mesh(new T.PlaneGeometry(0.7, 0.9), new T.MeshLambertMaterial({ color: '#fff', side: T.DoubleSide })); s.position.set(0.1, 0.8, 0); s.castShadow = true; g.add(s); const f = box(0.2, 0.1, 0.02, '#e0383b', 0, 1.38, 0); g.add(f); }
function granja(g) { g.add(box(0.9, 0.12, 0.8, '#7a4a2a', 0, 0.06, 0)); for (let i = 0; i < 3; i++) for (let j = 0; j < 3; j++) g.add(mesh(new T.IcosahedronGeometry(0.1, 0), M('#43c95a'), -0.28 + i * 0.28, 0.2, -0.26 + j * 0.26)); g.add(box(0.08, 0.35, 0.08, '#8a5a34', 0.4, 0.3, -0.3)); }
const MK = { cabana: house, molino: mill, faro, rayo, vela, granja };
function rebuildBuildings() {
  animated.blades.length = 0; animated.smoke.length = 0; animated.bang.length = 0;
  plotGroups.forEach((g, i) => {
    for (let k = g.children.length - 1; k >= 0; k--) { const ch = g.children[k]; if (ch.userData.bld) g.remove(ch); }
    const p = S.plots[i];
    plotRings[i].ring.visible = plotRings[i].plus.visible = !p;
    if (!p) return;
    const b = new T.Group(); b.userData.bld = true; MK[p.type](b); g.add(b);
    if (p.dmg) {
      b.traverse(o => { if (o.isMesh && o.material && o.material.color && !o.userData.keep) { o.material = o.material.clone(); o.material.color.multiplyScalar(0.55); } });
      const sp = new T.Sprite(new T.SpriteMaterial({ map: bangTex, depthTest: false })); sp.scale.set(0.5, 0.5, 1); sp.position.set(0, 1.9, 0); sp.renderOrder = 6; b.add(sp); animated.bang.push(sp);
      for (let k = 0; k < 3; k++) { const s = mesh(new T.IcosahedronGeometry(0.1, 0), new T.MeshLambertMaterial({ color: '#555', transparent: true, opacity: .6 }), 0, 0.9, 0, false); s.userData.ph = k / 3; b.add(s); animated.smoke.push(s); }
    }
  });
}
// nubes
const clouds = [];
function cloud(x, y, z, s) {
  const g = new T.Group();
  [[0, 0, 0, 1], [.7, -.1, .1, .75], [-.7, -.05, 0, .8], [.2, .2, -.3, .7], [-.3, .1, .4, .6]].forEach(([a, b, c, r]) => g.add(mesh(new T.IcosahedronGeometry(r, 0), M('#ffffff', { emissive: new T.Color('#d4e6f7') }), a, b, c, false)));
  g.position.set(x, y, z); g.scale.setScalar(s); scene.add(g); clouds.push(g); return g;
}
for (let i = 0; i < 4; i++) { const a = i * 1.6 + .3; cloud(Math.cos(a) * 2.2, -5.1, Math.sin(a) * 2.2, 1.2 + (i % 2) * .4); }
[[-9, 1, -8, 1.6], [10, 3, -10, 2], [-11, -2, 4, 1.5], [9, -3, 7, 1.8], [2, 6, -14, 2.2], [-6, 5, -12, 1.4]].forEach(a => cloud(...a));
// islas lejanas
function farIsle(x, y, z, s) { const g = new T.Group(); g.add(box(2, 0.4, 2, '#6fcf4f', 0, 0, 0)); g.add(box(1.8, 1.6, 1.8, '#8f5e3b', 0, -1, 0)); g.add(box(1.2, 1.2, 1.2, '#82552f', 0, -2.4, 0)); const t = mesh(new T.IcosahedronGeometry(.4, 0), M('#43b85a'), .3, .6, .2); g.add(t); g.position.set(x, y, z); g.scale.setScalar(s); scene.add(g); return g; }
const far = [farIsle(-10, 2.5, 4, 0.9), farIsle(10, 1, -10, 1.1)];

/* cámara y control */
let yaw = 0, targetYaw = 0, pitch = 0;
function layout() {
  const w = app().clientWidth, h = app().clientHeight;
  renderer.setSize(w, h, false); camera.aspect = w / h;
  const asp = camera.aspect;
  camera.fov = asp < 0.8 ? 38 : 30; camera.updateProjectionMatrix();
  camera.userData.dist = asp < 0.8 ? 24.5 : 19;
}
function app() { return $('#app'); }
function placeCamera(t) {
  const d = camera.userData.dist || 20, a = Math.PI / 4 + yaw + Math.sin(t * 0.3) * 0.04;
  camera.position.set(Math.cos(a) * d * 0.72, d * 0.55, Math.sin(a) * d * 0.72);
  camera.lookAt(0, -0.9 + (camera.aspect < 0.8 ? -0.2 : 0), 0);
}
const ray = new T.Raycaster(), ptr = new T.Vector2();
let down = null, moved = 0;
canvas.addEventListener('pointerdown', e => { down = { x: e.clientX, y: e.clientY, yaw: targetYaw }; moved = 0; canvas.setPointerCapture(e.pointerId); });
canvas.addEventListener('pointermove', e => { if (!down) return; const dx = e.clientX - down.x; moved = Math.max(moved, Math.abs(dx) + Math.abs(e.clientY - down.y)); targetYaw = clamp(down.yaw + dx * 0.006, -0.9, 0.9); });
canvas.addEventListener('pointerup', e => {
  if (!down) return; const wasTap = moved < 8; down = null; if (!wasTap) return;
  const r = canvas.getBoundingClientRect(); ptr.set(((e.clientX - r.left) / r.width) * 2 - 1, -((e.clientY - r.top) / r.height) * 2 + 1);
  ray.setFromCamera(ptr, camera);
  const hit = ray.intersectObjects(plotHits, false)[0];
  if (hit) { S.seenHint = true; save(); refreshBanner(); openBuild(hit.object.userData.plot); }
});
canvas.addEventListener('pointercancel', () => { down = null; });
window.addEventListener('resize', layout);

let last = performance.now(), mapT = 0;
function frame(now) {
  const dt = Math.min(0.05, (now - last) / 1000); last = now; const t = now / 1000;
  const speed = S.trip ? 5 : 1;
  yaw += (targetYaw - yaw) * 0.12;
  island.position.y = Math.sin(t * 0.9) * (S.trip ? 0.14 : 0.07);
  island.rotation.z = Math.sin(t * 0.7) * (S.trip ? 0.025 : 0.01);
  animated.blades.forEach(b => b.rotation.z += dt * (S.trip ? 3 : 1.2));
  animated.smoke.forEach(s => { s.userData.ph = (s.userData.ph + dt * 0.5) % 1; s.position.y = 0.9 + s.userData.ph * 0.9; s.material.opacity = 0.6 * (1 - s.userData.ph); s.scale.setScalar(0.6 + s.userData.ph); });
  animated.bang.forEach(s => { s.position.y = 1.9 + Math.sin(t * 4) * 0.06; });
  plotRings.forEach(o => { const k = 1 + Math.sin(t * 3) * 0.08; o.ring.scale.set(k, k, k); o.plus.position.y = 0.5 + Math.sin(t * 3) * 0.04; });
  man.position.x = 0.3 + Math.sin(t * 0.6) * 0.5; man.rotation.y = Math.cos(t * 0.6) > 0 ? Math.PI / 2 : -Math.PI / 2; man.position.y = Math.abs(Math.sin(t * 6)) * 0.03;
  clouds.forEach((c, i) => { c.position.x += dt * speed * (0.12 + (i % 3) * 0.04); if (c.position.x > 14) c.position.x = -14; });
  far.forEach((f, i) => { f.position.y += Math.sin(t * 0.5 + i) * 0.002; f.rotation.y += dt * 0.05; });
  placeCamera(t);
  renderer.render(scene, camera);
  mapT += dt; if (mapT > 0.5) { mapT = 0; drawMap(); tickTrip(); }
  requestAnimationFrame(frame);
}

/* ---------- arranque ---------- */
buildHud();
layout();
refreshAll();
if (S.trip && Date.now() >= S.trip.end) resolveTrip();
requestAnimationFrame(frame);
window.__isla = { S: () => S, depart, resolveTrip, openExplore, openBuild, openWheel, openLog, openCrew, save };
})();
</script>
